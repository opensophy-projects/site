name: Fix ElectricLogo ESLint

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix ElectricLogo ESLint issues
        run: npx eslint apps/web/src/lib/components/ui-registry/Electriclogo.svelte --fix

      - name: Verify ElectricLogo lint
        run: npx eslint apps/web/src/lib/components/ui-registry/Electriclogo.svelte

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/components/ui-registry/Electriclogo.svelte
          git rm .github/workflows/fix-electriclogo-eslint.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: clean up ElectricLogo eslint directives"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
