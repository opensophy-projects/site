name: CI / Deploy

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # ── 2. Dependency Audit ───────────────────────────────────────────────
  audit:
    name: Dependency Audit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (warning-only)
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate --json > "$RUNNER_TEMP/npm-audit.json" 2>&1
          audit_status=$?
          set -e

          if [ "$audit_status" -eq 0 ]; then
            echo "Dependency audit passed."
            exit 0
          fi

          if node -e '
            const fs = require("fs");
            try {
              const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const v = report.metadata && report.metadata.vulnerabilities;
              if (!v) process.exit(2);
              const total = v.total || 0;
              const details = ["critical", "high", "moderate", "low", "info"]
                .filter(level => v[level])
                .map(level => `${level}: ${v[level]}`)
                .join(", ");
              console.log(`::warning::Dependency audit found ${total} vulnerability finding(s)${details ? ` (${details})` : ""}. Review npm audit and update affected dependencies when appropriate.`);
            } catch {
              process.exit(2);
            }
          ' "$RUNNER_TEMP/npm-audit.json"; then
            exit 0
          else
            echo "::warning::Dependency audit could not complete (npm audit exit code: ${audit_status}); check registry access and the audit report."
            exit 0
          fi

  # ── 3. Semgrep SAST ───────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
            p/javascript
            p/typescript
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── 4. SonarCloud ─────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud
    needs: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── 5. Build ──────────────────────────────────────────────────────────
  build:
    name: Build
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/build

  # ── 6. Deploy ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
